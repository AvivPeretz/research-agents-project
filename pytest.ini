[pytest]
markers =
    live: makes real network calls to external LLM provider APIs (NVIDIA NIM, ...).
        Requires real API keys in the environment/.env. Deselected by default (see
        addopts below) so it never runs as part of the normal fast unit-test suite or
        CI; run explicitly with: pytest -m live tests/live/
addopts = -m "not live"
